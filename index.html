<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="logo-box">
        <img src="images/odin-lined.png" alt="Odin logo" width="64" height="64">
        <span class="logo-text">ODIN</span>
      </div>
      <p class="hero-note">The best way to learn is to build something.</p>
    </section>

    <section class="signup">
      <div class="signup-inner">
        <div class="intro">
          <h1>Let's do this!</h1>
          <p>Create your account below and start your journey.</p>
        </div>

        <form action="#" method="post">
          <div class="field">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first_name" required>
          </div>

          <div class="field">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last_name" required>
          </div>

          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
          </div>

          <div class="field">
            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone" placeholder="555-123-4567">
          </div>

          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required>
          </div>

          <div class="field">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm_password" minlength="8" required>
          </div>

          <div class="actions">
            <button type="submit">Create Account</button>
            <p class="login">Already have an account? <a href="#">Log in</a></p>
          </div>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
